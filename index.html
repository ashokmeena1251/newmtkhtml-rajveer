  <style>
    /* =========================================================
       1. SMOOTH MOVING BACKGROUND THEME
       ========================================================= */
    body {
      background-color: #FFF9F1;
      overflow-x: hidden;
    }

    /* Moving radiant gradient backdrop */
    .animated-bg {
      position: fixed;
      inset: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 50% 30%, #FFF2DD 0%, #FFE5C4 28%, #FFF7EC 55%, #FFDFB8 85%, #FFE9D1 100%);
      background-size: 200% 200%;
      animation: ambientShift 22s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes ambientShift {
      0% {
        transform: translate(0, 0) scale(1);
        background-position: 0% 25%;
      }
      50% {
        transform: translate(-30px, 20px) scale(1.05);
        background-position: 100% 75%;
      }
      100% {
        transform: translate(25px, -25px) scale(0.98);
        background-position: 50% 100%;
      }
    }

    /* Ambient light orbs that drift gently */
    .drift-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      mix-blend-mode: multiply;
      opacity: 0.55;
      animation: orbFloat 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .drift-orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #FFA114 0%, rgba(255, 180, 50, 0.6) 45%, transparent 75%);
      top: 5%;
      left: 10%;
    }

    .drift-orb-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, #FF7700 0%, rgba(255, 140, 0, 0.45) 50%, transparent 80%);
      bottom: 8%;
      right: 5%;
      animation-duration: 20s;
      animation-delay: -5s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -35px) scale(1.12); }
      100% { transform: translate(-30px, 30px) scale(0.94); }
    }

    /* Floating glowing dust/sparkles */
    .sparkle-particle {
      position: absolute;
      border-radius: 50%;
      background: #fff126;
      box-shadow: 0 0 10px 2px rgba(255, 167, 38, 0.85);
      pointer-events: none;
      animation: sparkleDrift 8s ease-in-out infinite alternate;
    }

    @keyframes sparkleDrift {
      0% {
        transform: translateY(0px) translateX(0px) scale(0.8);
        opacity: 0.25;
      }
      50% {
        transform: translateY(-28px) translateX(12px) scale(1.2);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-56px) translateX(-10px) scale(0.85);
        opacity: 0.3;
      }
    }

    /* =========================================================
       2. NORMAL-SPEED INFINITE BUTTON REFLECTION (SHINE)
       ========================================================= */
    .infinite-shine {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* Primary reflection beam */
    .infinite-shine::before {
      content: '';
      position: absolute;
      top: -70%;
      left: -140%;
      width: 55%;
      height: 240%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 25%,
        rgba(255, 255, 255, 0.65) 50%,
        rgba(255, 255, 255, 0.12) 75%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      pointer-events: none;
      z-index: 5;
      animation: normalShine 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Secondary soft tail beam for natural glint */
    .infinite-shine::after {
      content: '';
      position: absolute;
      top: -70%;
      left: -160%;
      width: 25%;
      height: 240%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      pointer-events: none;
      z-index: 5;
      animation: normalShine 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.14s;
    }

    /* Normal-speed infinite loop keyframe */
    @keyframes normalShine {
      0% {
        left: -140%;
      }
      45%, 100% {
        left: 220%;
      }
    }

    /* Staggered timings so they sparkle in harmony */
    .shine-btn-1::before, .shine-btn-1::after {
      animation-delay: 0s;
    }
    .shine-btn-2::before, .shine-btn-2::after {
      animation-delay: 1.1s;
    }
    .shine-btn-3::before, .shine-btn-3::after {
      animation-delay: 2.2s;
    }

    /* Warm golden reflection sweep on the dark button */
    .shine-gold::before {
      background: linear-gradient(
        115deg,
        rgba(255, 200, 50, 0) 0%,
        rgba(255, 215, 0, 0.15) 25%,
        rgba(255, 235, 140, 0.75) 50%,
        rgba(255, 200, 50, 0.18) 75%,
        rgba(255, 200, 50, 0) 100%
      );
    }
    .shine-gold::after {
      background: linear-gradient(
        115deg,
        rgba(255, 215, 0, 0) 0%,
        rgba(255, 245, 170, 0.4) 50%,
        rgba(255, 215, 0, 0) 100%
      );
    }

    /* =========================================================
       3. AMBIENT GLOW DIVIDER & BUTTON PULSE
       ========================================================= */
    .glowing-amber-divider {

      background: radial-gradient(ellipse at center, rgba(255,145,0,0.95) 0%, rgba(255,160,0,0.5) 55%, rgba(255,170,0,0) 100%);

    /* Gentle button interaction state */

    }
    .interactive-btn:hover {

  </style>

  <!-- Interaction Logic -->
  <script>
    let toastTimeout;

    function displayToast(message) {
      const toast = document.getElementById('statusToast');
      const msg = document.getElementById('toastMsg');
      if (!toast || !msg) return;
      
      clearTimeout(toastTimeout);
      msg.innerText = message;
      
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2500);
    }
  </script>
